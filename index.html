<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arjay's Chicken Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>🍗 Arjay's Chicken</h1>
        <p>Total: <b>₱<span id="total-price">0.00</span></b></p>
    </div>

    <div class="container">
        
        <div class="section">
            <h2 class="section-title">1. Select Products</h2>
            <div class="product-vertical">
                
                <div class="product-row">
                    <div class="info">
                        <span class="p-name">Whole Chicken</span>
                        <span class="p-price">₱240/kg</span>
                    </div>
                    <div class="action">
                        <input type="number" id="qty-whole" value="1" min="0.1" step="0.1">
                        <button onclick="addToCart('Whole Chicken', 240, 'qty-whole')">Add</button>
                    </div>
                </div>

                <div class="product-row">
                    <div class="info">
                        <span class="p-name">Chicken Breast</span>
                        <span class="p-price">₱265/kg</span>
                    </div>
                    <div class="action">
                        <input type="number" id="qty-breast" value="1" min="0.1" step="0.1">
                        <button onclick="addToCart('Chicken Breast', 265, 'qty-breast')">Add</button>
                    </div>
                </div>

                <div class="product-row">
                    <div class="info">
                        <span class="p-name">Chicken Wings</span>
                        <span class="p-price">₱260/kg</span>
                    </div>
                    <div class="action">
                        <input type="number" id="qty-wings" value="1" min="0.1" step="0.1">
                        <button onclick="addToCart('Chicken Wings', 260, 'qty-wings')">Add</button>
                    </div>
                </div>

            </div>
        </div>

        <div class="section">
            <h2 class="section-title">2. Customer Details</h2>
            <input type="text" id="cust-name" placeholder="Pangalan" class="small-input">
            <input type="text" id="cust-phone" placeholder="Contact Number" class="small-input">
            <textarea id="cust-address" placeholder="Address" class="small-text"></textarea>
            
            <label class="label-small">Instructions (Hiwa):</label>
            <textarea id="overall-instructions" placeholder="Ex: Hiwa sa tinola..." class="small-text"></textarea>
        </div>

        <div class="section receipt">
            <h2 class="section-title">Order Summary</h2>
            <ul id="order-list"></ul>
            <button class="email-button" onclick="submitOrder()">📧 Send Order via Email</button>
            <button class="reset-link" onclick="resetCart()">Clear All</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
